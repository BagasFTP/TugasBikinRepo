<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Galeri Alam</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  </head>
  <body class="bg-dark text-light text-center p-4">

    <h1 class="text-info mb-4">Galeri Alam</h1>

    <div id="galeriCarousel" class="carousel slide" data-bs-ride="carousel">
      <div class="carousel-inner">

        <!-- Gambar 1 -->
        <div class="carousel-item active">
          <a href="https://blog.eigeradventure.com/keindahan-alam-indonesia/" target="_blank">
            <img src="gambar/download.jpeg" class="d-block mx-auto rounded border border-info shadow-lg" width="240" height="160" alt="Alam 1">
          </a>
        </div>

        <!-- Gambar 2 -->
        <div class="carousel-item">
          <img src="gambar/physics-hero.avif" class="d-block mx-auto rounded border border-info shadow-lg" width="240" height="160" alt="Alam 2">
        </div>

        <!-- Gambar 3 -->
        <div class="carousel-item">
          <img src="gambar/SYD-1600-x-500-desktop-copy-600x188.jpg" class="d-block mx-auto rounded border border-info shadow-lg" width="240" height="160" alt="Alam 3">
        </div>

      </div>

      <!-- Tombol kontrol -->
      <button class="carousel-control-prev" type="button" data-bs-target="#galeriCarousel" data-bs-slide="prev">
        <span class="carousel-control-prev-icon"></span>
      </button>
      <button class="carousel-control-next" type="button" data-bs-target="#galeriCarousel" data-bs-slide="next">
        <span class="carousel-control-next-icon"></span>
      </button>
    </div>

    <p class="mt-3 text-secondary small">Klik gambar pertama untuk melihat link asli 🌿</p>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
