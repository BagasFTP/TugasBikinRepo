<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-dark text-light d-flex align-items-center justify-content-center vh-100">

  <div class="card bg-secondary text-light shadow-lg p-4 rounded-4" style="min-width: 350px; max-width: 400px;">
    <h3 class="text-center text-info mb-4">Login</h3>

    <form>
      <!-- Username -->
      <div class="mb-3">
        <label for="username" class="form-label">Username</label>
        <input type="text" class="form-control bg-dark text-light border-info" id="username" placeholder="Masukkan username" required>
      </div>

      <!-- Password -->
      <div class="mb-3">
        <label for="password" class="form-label">Password</label>
        <input type="password" class="form-control bg-dark text-light border-info" id="password" placeholder="Masukkan password" required>
      </div>

      <!-- Remember Me -->
      <div class="form-check mb-3">
        <input class="form-check-input border-info" type="checkbox" id="remember">
        <label class="form-check-label" for="remember">
          Ingat saya
        </label>
      </div>

      <!-- Tombol -->
      <div class="d-grid">
        <button type="submit" class="btn btn-info text-dark fw-bold">Login</button>
      </div>
    </form>

    <!-- Link tambahan -->
    <p class="text-center mt-3 mb-0">
      <a href="#" class="text-info text-decoration-none">Lupa password?</a>
    </p>
    <p class="text-center mt-2 mb-0">
      Belum punya akun? <a href="#" class="text-info text-decoration-none">Daftar</a>
    </p>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
